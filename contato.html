<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contato — Eliab Monitoramento</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="light-page">
  <header class="site-header light">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="assets/eliab.png" alt="Eliab Logo" class="logo">
        <span class="brand-text dark">Eliab Monitoramento</span>
      </a>
      <nav class="main-nav" id="mainNav4">
        <a href="servicos.html">Serviços</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
      </nav>
      <button id="mobileBtn4" class="mobile-btn" aria-label="menu">☰</button>
    </div>
  </header>

  <main class="container light-content">
    <section class="section">
      <h1>Fale Conosco</h1>
      <p class="section-sub dark">Solicite um orçamento ou tire suas dúvidas.</p>

      <form id="contactForm" class="contact-form" onsubmit="event.preventDefault(); alert('Formulário enviado (mock)');">
        <label>Nome</label>
        <input type="text" required placeholder="Seu nome">
        <label>Email</label>
        <input type="email" required placeholder="seu@email.com">
        <label>Telefone</label>
        <input type="tel" placeholder="(00) 00000-0000">
        <label>Mensagem</label>
        <textarea rows="5" required placeholder="Descreva sua necessidade"></textarea>
        <button class="btn btn-primary" type="submit">Enviar</button>
      </form>

      <div class="contact-info">
        <p><strong>Email:</strong> contato@eliabmonitoramento.com</p>
        <p><strong>Telefone:</strong> (00) 00000-0000</p>
      </div>
    </section>
  </main>

  <footer class="site-footer light">
    <div class="container footer-inner">
      <p class="muted dark">© 2025 Eliab Monitoramento — Todos os direitos reservados.</p>
    </div>
  </footer>

  <a class="whatsapp-float" href="https://wa.me/5599999999999" target="_blank" rel="noopener" aria-label="WhatsApp">

  </a>

  <script src="js/script.js"></script>
</body>
</html>
